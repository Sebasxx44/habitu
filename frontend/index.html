    <title>habitu · Tu próximo plan, reservado.</title>
    <script>
      (() => {
        let preference = 'system';
        try {
          const saved = localStorage.getItem('elegantbarb-theme');
          if (saved === 'light' || saved === 'dark' || saved === 'system') preference = saved;
        } catch {
          // The system preference remains available when browser storage is disabled.
        }
        const isDark = preference === 'dark' || (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.add(isDark ? 'dark' : 'light');
        document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', isDark ? '#101324' : '#FBFBFF');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('SW registered:', reg.scope))
            .catch((err) => console.log('SW registration failed:', err));
        });
      }
    </script>
  </body>
