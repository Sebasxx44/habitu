services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: elegantbarb_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
      - reportsdata:/var/www/storage/app/private/reports
    networks:
      - elegantbarb_network
    environment: &app_environment
      - APP_ENV=${APP_ENV}
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=${APP_DEBUG}
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - REPORT_REDIS_HOST=redis
      - REPORT_REDIS_DB=2
      - REPORT_DIRECTORY=/var/www/storage/app/private/reports
      - BROADCAST_DRIVER=pusher
      - PUSHER_HOST=soketi
      - PUSHER_PORT=6001
      - PUSHER_SCHEME=http
      - PUSHER_APP_ID=${PUSHER_APP_ID:-habitu-local}
      - PUSHER_APP_KEY=${PUSHER_APP_KEY:-habitu-local-key}
      - PUSHER_APP_SECRET=${PUSHER_APP_SECRET:-habitu-local-secret}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    image: nginx:alpine
    container_name: elegantbarb_web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
    networks:
      - elegantbarb_network
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:15-alpine
    container_name: elegantbarb_db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - elegantbarb_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    container_name: elegantbarb_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - elegantbarb_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  soketi:
    image: quay.io/soketi/soketi:1.6-16-debian
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PUSHER_FORWARD_PORT:-6001}:6001"
    environment:
      SOKETI_DEFAULT_APP_ID: ${PUSHER_APP_ID:-habitu-local}
      SOKETI_DEFAULT_APP_KEY: ${PUSHER_APP_KEY:-habitu-local-key}
      SOKETI_DEFAULT_APP_SECRET: ${PUSHER_APP_SECRET:-habitu-local-secret}
      SOKETI_DEFAULT_APP_ENABLE_CLIENT_MESSAGES: "false"
    networks:
      - elegantbarb_network

  report-worker:
    build: ../services/report-worker
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${DB_USERNAME}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_DATABASE}
      PGSSLMODE: disable
      REPORT_REDIS_HOST: redis
      REPORT_REDIS_DB: 2
      REPORT_DIRECTORY: /reports
      PUSHER_APP_ID: ${PUSHER_APP_ID:-habitu-local}
      PUSHER_APP_KEY: ${PUSHER_APP_KEY:-habitu-local-key}
      PUSHER_APP_SECRET: ${PUSHER_APP_SECRET:-habitu-local-secret}
      PUSHER_HOST: soketi
      PUSHER_PORT: 6001
      PUSHER_SCHEME: http
    volumes:
      - reportsdata:/reports
    networks:
      - elegantbarb_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: elegantbarb_scheduler
    environment: *app_environment
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - elegantbarb_network
    depends_on:
      - app
      - db
      - redis
    command: >
      sh -c "while true; do
        php artisan schedule:run --no-interaction;
        sleep 60;
      done"

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: elegantbarb_queue
    environment: *app_environment
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - elegantbarb_network
    depends_on:
      - app
      - db
      - redis
    command: >
      sh -c "php artisan queue:work --queue=realtime,default --sleep=1 --tries=3 --timeout=90 --max-time=3600"

networks:
  elegantbarb_network:
    driver: bridge

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  reportsdata:
    driver: local
