services:
  postgres:
    image: postgres:16-alpine
    container_name: elegantbarb_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: elegantbarb
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:${REDIS_FORWARD_PORT:-6381}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  soketi:
    image: quay.io/soketi/soketi:1.6-16-debian
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PUSHER_FORWARD_PORT:-6001}:6001"
    environment:
      SOKETI_DEFAULT_APP_ID: ${PUSHER_APP_ID:-habitu-local}
      SOKETI_DEFAULT_APP_KEY: ${PUSHER_APP_KEY:-habitu-local-key}
      SOKETI_DEFAULT_APP_SECRET: ${PUSHER_APP_SECRET:-habitu-local-secret}
      SOKETI_DEFAULT_APP_ENABLE_CLIENT_MESSAGES: "false"

  report-worker:
    build: ./services/report-worker
    restart: unless-stopped
    user: "${REPORT_WORKER_UID:-1000}:${REPORT_WORKER_GID:-1000}"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/elegantbarb?sslmode=disable
      REPORT_REDIS_HOST: redis
      REPORT_REDIS_DB: 2
      REPORT_DIRECTORY: /reports
      PUSHER_APP_ID: ${PUSHER_APP_ID:-habitu-local}
      PUSHER_APP_KEY: ${PUSHER_APP_KEY:-habitu-local-key}
      PUSHER_APP_SECRET: ${PUSHER_APP_SECRET:-habitu-local-secret}
      PUSHER_HOST: soketi
      PUSHER_PORT: 6001
      PUSHER_SCHEME: http
    volumes:
      - ./elegantbarb-backend/storage/app/private/reports:/reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
