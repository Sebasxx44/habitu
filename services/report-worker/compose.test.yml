services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: report_worker_test
      POSTGRES_PASSWORD: isolated_test_only
      POSTGRES_DB: report_worker_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U report_worker_test"]
      interval: 2s
      timeout: 2s
      retries: 20
  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
  tests:
    image: golang:1.24-alpine
    working_dir: /src
    volumes:
      - .:/src
      - go_test_cache:/go
    environment:
      REPORT_WORKER_TEST_DATABASE_URL: postgres://report_worker_test:isolated_test_only@postgres:5432/report_worker_test?sslmode=disable
      REPORT_WORKER_TEST_REDIS: redis:6379
    command: sh -c "go test -count=1 -v ./... && go vet ./..."
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
volumes:
  go_test_cache:
